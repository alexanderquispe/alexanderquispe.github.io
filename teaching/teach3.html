      .container {
        width: 210px; /* Ajusta este valor según el ancho deseado */
        height: 200px; /* Ajusta este valor según la altura deseada */
        position: relative;
        overflow: hidden;
        margin: 10px;
      }

      .std_image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .container:hover .overlay {
        opacity: 1;
      }

      .overlay h3,
      .overlay p {
        color: white;
        text-align: center;
        margin: 5px 0;
      }

      .icon {
        color: white;
        font-size: 24px;
        margin: 0 10px;
      }

      #Students {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
    </style>
