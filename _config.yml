# Site settings — built by GitHub Pages (Jekyll) from the `ss` branch.
title: Alexander Quispe
tagline: Ph.D. Student at Caltech
description: >-
  Alexander Quispe - Ph.D. student in Computing and Mathematical Sciences at Caltech.
  Research on the economics of AI, causal machine learning, and econometrics.
url: https://alexanderquispe.github.io
baseurl: ""
author:
  name: Alexander Quispe
  twitter: Alex_QR_CG
lang: en_US

# Used by jekyll-seo-tag for the JSON-LD "sameAs" profile links.
social:
  name: Alexander Quispe
  links:
    - https://scholar.google.com/citations?user=iUKWQDcAAAAJ
    - https://github.com/alexanderquispe
    - https://x.com/Alex_QR_CG
    - https://www.linkedin.com/in/alexander-quispe-37ab42173

twitter:
  username: Alex_QR_CG
  card: summary

# Blog posts live in _posts/ as YYYY-MM-DD-title.md (drafts in _drafts/)
permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: blog/feed.xml

# giscus comments (GitHub Discussions of this repo, "Announcements" category)
giscus:
  repo: alexanderquispe/alexanderquispe.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkzODIzOTAzNTI=
  category: Announcements
  category_id: DIC_kwDOFsrQUM4DKwnH

defaults:
  - scope:
      path: ""
    values:
      image: /img/alex_foto.jpg
  - scope:
      type: posts
    values:
      layout: post
      comments: true
  # Keep the Search Console verification file out of the sitemap
  - scope:
      path: googled8829529be240c6b.html
    values:
      sitemap: false

exclude:
  - README.md
  - .gitignore
